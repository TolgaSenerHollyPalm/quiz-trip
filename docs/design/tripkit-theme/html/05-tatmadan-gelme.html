<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>TripKit — Tatmadan gelme</title>
</head>
<body>
<x-dc>
<helmet>
<!-- Fontlar: Bricolage Grotesque + Figtree -->
<style>
body{margin:0;background:#F7F5F0}
a{color:#075F59}a:hover{color:#0A7D76}
input::placeholder{color:#7A807D}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F7F5F0; color: #1B1F1E; font-family: 'Figtree', system-ui, sans-serif">

<header style="padding: 12px 20px 0; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
<a href="02-gezi.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E8E2D7; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="#1B1F1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<button style="height: 44px; padding: 0 14px; border: 0; background: transparent; color: #075F59; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Düzenle</button>
</header>

<div style="padding: 14px 20px 0; display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: #FBF0D6; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v6a2 2 0 0 0 2 2v10M11 3v6a2 2 0 0 1-2 2M9 3v5M17 21V3c-2.2 1.4-3.2 4-3.2 7.5H17" fill="none" stroke="#8A5A0B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 800">Tatmadan gelme</h1>
<span style="font-size: 14px; color: #5E6562">Mutlaka denenecek tatlar</span>
</div>
</div>

<div style="margin: 18px 20px 0; display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; height: 8px; border-radius: 999px; background: #EFEAE0; overflow: hidden"><span style="display: block; width: 14%; height: 8px; border-radius: 999px; background: #F0B23F"></span></span>
<span style="font-size: 14px; font-weight: 700; color: #8A5A0B; white-space: nowrap">1 / 7 tadıldı</span>
</div>

<form style="margin: 16px 20px 0; padding: 6px 6px 6px 16px; background: #FFFFFF; border: 1px solid #E8E2D7; border-radius: 18px; display: flex; align-items: center; gap: 8px">
<label for="add-taste" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tatmak istediğin şey</label>
<input id="add-taste" type="text" placeholder="Ne tatmak istiyorsun?" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; background: transparent; font: inherit; font-size: 16px; color: #1B1F1E; outline: none">
<button type="button" aria-label="Listeye ekle" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #F0B23F; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="#3A2A06" stroke-width="2.4" stroke-linecap="round"></path></svg></button>
</form>

<ul style="margin: 12px 20px 0; padding: 0; list-style: none; background: #FFFFFF; border: 1px solid #E8E2D7; border-radius: 20px; overflow: hidden">
<li style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-bottom: 1px solid #F0EBE2">
<button aria-label="Koşari: tadıldı olarak işaretle" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #948C80"></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Koşari</span><span style="font-size: 13px; color: #5E6562">Pirinç, makarna, mercimek; sokak yemeği</span></span>
</li>
<li style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-bottom: 1px solid #F0EBE2">
<button aria-label="Ful medames: tadıldı olarak işaretle" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #948C80"></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Ful medames</span><span style="font-size: 13px; color: #5E6562">Otel kahvaltısında</span></span>
</li>
<li style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-bottom: 1px solid #F0EBE2">
<button aria-label="Taamiya: tadıldı olarak işaretle" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #948C80"></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Taamiya</span><span style="font-size: 13px; color: #5E6562">Baklalı falafel</span></span>
</li>
<li style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-bottom: 1px solid #F0EBE2">
<button aria-label="Molohiya: tadıldı olarak işaretle" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #948C80"></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Molohiya</span><span style="font-size: 13px; color: #5E6562">Pilavla</span></span>
</li>
<li style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-bottom: 1px solid #F0EBE2">
<button aria-label="Ümmü Ali: tadıldı olarak işaretle" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #948C80"></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Ümmü Ali</span><span style="font-size: 13px; color: #5E6562">Sıcak tatlı</span></span>
</li>
<li style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px">
<button aria-label="Basbusa: tadıldı olarak işaretle" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #948C80"></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Basbusa</span><span style="font-size: 13px; color: #5E6562">İrmik tatlısı</span></span>
</li>
</ul>

<button style="margin: 20px 20px 0; align-self: flex-start; height: 44px; padding: 0 4px; border: 0; background: transparent; display: flex; align-items: center; gap: 8px; color: #4A504D; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="#4A504D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Tadıldı · 1</button>
<ul style="margin: 4px 20px 0; padding: 0; list-style: none; background: #FFFFFF; border: 1px solid #E8E2D7; border-radius: 20px; overflow: hidden">
<li style="display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 8px">
<button aria-label="Karkade: işareti kaldır" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 999px; background: #B97A0B; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; color: #5E6562; text-decoration: line-through; text-decoration-color: #B7B0A3">Karkade</span><span style="font-size: 13px; color: #5E6562">Soğuk içtik, çok iyiydi</span></span>
</li>
</ul>

</div>
</x-dc>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>TripKit — Almadan gelme</title>
</head>
<body>
<x-dc>
<helmet>
<!-- Fontlar: Bricolage Grotesque + Figtree -->
<style>
body{margin:0;background:#F7F5F0}
a{color:#075F59}a:hover{color:#0A7D76}
input::placeholder{color:#7A807D}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F7F5F0; color: #1B1F1E; font-family: 'Figtree', system-ui, sans-serif">

<header style="padding: 12px 20px 0; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
<a href="02-gezi.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E8E2D7; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="#1B1F1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<button style="height: 44px; padding: 0 14px; border: 0; background: transparent; color: #075F59; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Düzenle</button>
</header>

<div style="padding: 14px 20px 0; display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: #FFE9E4; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l-1 12.5h-11z" fill="none" stroke="#B23A26" stroke-width="1.7" stroke-linejoin="round"></path><path d="M9 10V7a3 3 0 0 1 6 0v3" fill="none" stroke="#B23A26" stroke-width="1.7" stroke-linecap="round"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 800">Almadan gelme</h1>
<span style="font-size: 14px; color: #5E6562">Eve dönmeden alınacaklar</span>
</div>
</div>

<div style="margin: 18px 20px 0; display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; height: 8px; border-radius: 999px; background: #EFEAE0; overflow: hidden"><span style="display: block; width: 33%; height: 8px; border-radius: 999px; background: #FF6B57"></span></span>
<span style="font-size: 14px; font-weight: 700; color: #B23A26; white-space: nowrap">2 / 6 alındı</span>
</div>

<form style="margin: 16px 20px 0; padding: 6px 6px 6px 16px; background: #FFFFFF; border: 1px solid #E8E2D7; border-radius: 18px; display: flex; align-items: center; gap: 8px">
<label for="add-souvenir" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Almak istediğin şey</label>
<input id="add-souvenir" type="text" placeholder="Ne almak istiyorsun?" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; background: transparent; font: inherit; font-size: 16px; color: #1B1F1E; outline: none">
<button type="button" aria-label="Listeye ekle" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #D9493A; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg></button>
</form>

<ul style="margin: 12px 20px 0; padding: 0; list-style: none; background: #FFFFFF; border: 1px solid #E8E2D7; border-radius: 20px; overflow: hidden">
<li style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-bottom: 1px solid #F0EBE2">
<button aria-label="Papirüs tablo: alındı olarak işaretle" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #948C80"></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Papirüs tablo</span><span style="font-size: 13px; color: #5E6562">Eski Pazar’da bakılacak</span></span>
</li>
<li style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-bottom: 1px solid #F0EBE2">
<button aria-label="Karkade: alındı olarak işaretle" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #948C80"></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Karkade (hibiskus çayı)</span><span style="font-size: 13px; color: #5E6562">2 paket, baharatçıdan</span></span>
</li>
<li style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-bottom: 1px solid #F0EBE2">
<button aria-label="Kartuş kolye: alındı olarak işaretle" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #948C80"></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Kartuş kolye</span><span style="font-size: 13px; color: #5E6562">Adımız hiyeroglifle yazılsın</span></span>
</li>
<li style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px">
<button aria-label="Baharat: alındı olarak işaretle" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 2px solid #948C80"></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Baharat</span><span style="font-size: 13px; color: #5E6562">Kimyon ve kişniş</span></span>
</li>
</ul>

<button style="margin: 20px 20px 0; align-self: flex-start; height: 44px; padding: 0 4px; border: 0; background: transparent; display: flex; align-items: center; gap: 8px; color: #4A504D; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="#4A504D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Alındı · 2</button>
<ul style="margin: 4px 20px 0; padding: 0; list-style: none; background: #FFFFFF; border: 1px solid #E8E2D7; border-radius: 20px; overflow: hidden">
<li style="display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 8px; border-bottom: 1px solid #F0EBE2">
<button aria-label="Mısır pamuğu havlu: işareti kaldır" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 999px; background: #D9493A; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; color: #5E6562; text-decoration: line-through; text-decoration-color: #B7B0A3">Mısır pamuğu havlu</span><span style="font-size: 13px; color: #5E6562">Naama Bay</span></span>
</li>
<li style="display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 8px">
<button aria-label="Bastet heykelciği: işareti kaldır" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 999px; background: #D9493A; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; color: #5E6562; text-decoration: line-through; text-decoration-color: #B7B0A3">Bastet heykelciği</span><span style="font-size: 13px; color: #5E6562">Replika, antika değil</span></span>
</li>
</ul>

</div>
</x-dc>
</body>
</html>
